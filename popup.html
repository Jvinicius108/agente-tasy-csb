<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        width: 260px;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #1a252f;
        color: #ecf0f1;
        margin: 0;
      }
      h3 {
        margin: 0 0 14px 0;
        color: #2ecc71;
        font-size: 14px;
        font-weight: 600;
        text-align: center;
        letter-spacing: 0.3px;
      }
      .status {
        font-size: 12px;
        font-weight: 500;
        text-align: center;
        padding: 10px 12px;
        border-radius: 6px;
        margin-bottom: 10px;
        background: #2c3e50;
        border-left: 3px solid #7f8c8d;
        transition: all 0.2s;
      }
      .status.ativo {
        background: #1e3a2a;
        color: #2ecc71;
        border-left-color: #2ecc71;
      }
      .status.inativo {
        background: #3a1e1e;
        color: #e74c3c;
        border-left-color: #e74c3c;
      }
      .info {
        font-size: 11px;
        color: #95a5a6;
        text-align: center;
        line-height: 1.5;
        margin-bottom: 14px;
        padding: 0 4px;
      }
      .link {
        display: block;
        width: 100%;
        padding: 9px 12px;
        text-align: center;
        background: #34495e;
        color: #ecf0f1;
        text-decoration: none;
        border-radius: 5px;
        font-size: 11px;
        font-weight: 500;
        transition:
          background 0.2s,
          transform 0.1s;
      }
      .link:hover {
        background: #4a5f7a;
      }
      .link:active {
        transform: scale(0.98);
      }
      .version {
        font-size: 10px;
        color: #636e72;
        text-align: center;
        margin-top: 12px;
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <h3>🤖 Agente Tasy CSB</h3>
    <div class="status" id="status">Verificando Tasy...</div>
    <div class="info" id="info">O painel do agente aparece automaticamente ao abrir o Tasy.</div>
    <a href="options.html" target="_blank" class="link">📖 Como usar / Configurações</a>
    <div class="version" id="version">v--</div>
    <script src="popup.js"></script>
  </body>
</html>
